<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Championship | MotoGrid</title>
<link rel="stylesheet" href="../css/style.css"><style>
*{box-sizing:border-box}body{margin:0;background:#050605;color:#fff;font-family:Arial,Helvetica,sans-serif}.shell{width:min(1300px,calc(100% - 40px));margin:auto;padding:35px 0 70px}.back{color:#7cff00;text-decoration:none;font-size:10px;font-weight:900;text-transform:uppercase}.hero{margin-top:30px;border:1px solid rgba(255,255,255,.09);background:#0a0c0a;padding:28px;display:grid;grid-template-columns:180px 1fr;gap:25px}.image{aspect-ratio:16/10;background:#060706;border:1px solid rgba(255,255,255,.08);overflow:hidden;display:flex;align-items:center;justify-content:center;color:#555;font-size:9px}.image img{width:100%;height:100%;object-fit:cover}.kicker{color:#7cff00;font-size:9px;font-weight:900;letter-spacing:2px;text-transform:uppercase}h1{margin:7px 0;font-size:42px;font-style:italic;text-transform:uppercase}.desc{color:#777;font-size:11px;line-height:1.6}.tabs{display:flex;gap:8px;margin:18px 0}.tab{padding:12px 15px;border:1px solid rgba(255,255,255,.1);color:#777;font-size:9px;font-weight:900;text-transform:uppercase}.tab.active{border-color:#7cff00;color:#7cff00}.grid{display:grid;grid-template-columns:2fr 1fr;gap:18px}.panel{background:#0a0c0a;border:1px solid rgba(255,255,255,.09);padding:24px}.panel h2{margin:0 0 18px;text-transform:uppercase}.round{display:grid;grid-template-columns:60px 1fr auto;gap:12px;align-items:center;padding:14px;border-bottom:1px solid rgba(255,255,255,.06)}.round-no{color:#7cff00;font-weight:1000}.round small{display:block;color:#555;margin-top:4px}.status{font-size:8px;color:#7cff00;text-transform:uppercase}.stat{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid rgba(255,255,255,.06);font-size:10px}.stat span{color:#666;text-transform:uppercase}.empty{color:#666;font-size:11px}@media(max-width:750px){.hero,.grid{grid-template-columns:1fr}.image{max-width:300px}}
</style></head><body><div class="shell"><a class="back" href="racing-system.html">← Racing System</a><section class="hero"><div class="image" id="image">No Image</div><div><div class="kicker" id="status">Championship</div><h1 id="name">Loading...</h1><div class="desc" id="description"></div></div></section><div class="tabs"><div class="tab active">Overview</div><div class="tab">Results</div><div class="tab">Standings</div><div class="tab">Riders</div></div><div class="grid"><section class="panel"><h2>Rounds</h2><div id="rounds"></div></section><aside class="panel"><h2>Championship</h2><div class="stat"><span>Scoring</span><strong id="scoring">—</strong></div><div class="stat"><span>Rounds</span><strong id="roundCount">0</strong></div><div class="stat"><span>Active Round</span><strong id="activeRound">None</strong></div><div class="stat"><span>Imported Sessions</span><strong>0</strong></div></aside></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/supabase.js"></script><script>
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
(async()=>{try{const {data:{session}}=await supabaseClient.auth.getSession();if(!session){location.href="login.html";return}const id=new URLSearchParams(location.search).get("id");if(!id)throw new Error("Missing championship ID.");
const {data:c,error}=await supabaseClient.from("racing_championships").select("id,name,description,image_url,status,scoring_type").eq("id",id).single();if(error)throw error;
document.getElementById("name").textContent=c.name;document.getElementById("description").textContent=c.description||"No championship description.";document.getElementById("status").textContent=c.status;document.getElementById("scoring").textContent=c.scoring_type.toUpperCase();if(c.image_url)document.getElementById("image").innerHTML=`<img src="${esc(c.image_url)}" alt="">`;
const {data:r,error:re}=await supabaseClient.from("racing_rounds").select("*").eq("championship_id",id).order("round_number");if(re)throw re;document.getElementById("roundCount").textContent=r.length;const active=r.find(x=>x.status==="active");document.getElementById("activeRound").textContent=active?`R${active.round_number}`:"None";document.getElementById("rounds").innerHTML=r.length?r.map(x=>`<div class="round"><div class="round-no">R${x.round_number}</div><div><strong>${esc(x.name)}</strong><small>${esc(x.track_key||"Track not assigned")}</small></div><div class="status">${esc(x.status)}</div></div>`).join(""):'<div class="empty">No rounds configured.</div>';
}catch(e){console.error(e);document.getElementById("name").textContent="Could not load championship";document.getElementById("description").textContent=e.message||""}})();
</script></body></html>
