<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
    <title>Rider Profile | MotoGrid</title>

    <link rel="stylesheet" href="../css/style.css">

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            min-height: 100%;
            background: #050605;
        }

        body {
            min-height: 100vh;
            overflow-x: hidden;
            color: #fff;
            font-family: Arial, Helvetica, sans-serif;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        .profile-page {
            min-height: 100vh;
            background:
                radial-gradient(
                    circle at 50% 0%,
                    rgba(124,255,0,.08),
                    transparent 29%
                ),
                linear-gradient(
                    rgba(255,255,255,.018) 1px,
                    transparent 1px
                ),
                linear-gradient(
                    90deg,
                    rgba(255,255,255,.018) 1px,
                    transparent 1px
                ),
                #050605;
            background-size:
                auto,
                55px 55px,
                55px 55px,
                auto;
        }

        .profile-topbar {
            position: sticky;
            top: 0;
            z-index: 1000;
            min-height: 72px;
            border-bottom: 1px solid rgba(255,255,255,.09);
            background: rgba(5,6,5,.94);
            backdrop-filter: blur(14px);
        }

        .topbar-inner {
            width: min(1180px, calc(100% - 32px));
            min-height: 72px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: auto 1fr auto;
            align-items: center;
            gap: 20px;
            position: relative;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #fff;
        }

        .brand img {
            height: 42px;
            width: auto;
            display: block;
        }

        .brand-name {
            font-size: 16px;
            font-weight: 1000;
            font-style: italic;
            letter-spacing: 1px;
        }

        .brand-name span {
            color: #7cff00;
        }

        .profile-nav {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 18px;
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            white-space: nowrap;
        }

        .profile-nav a {
            color: #777;
            font-size: 8px;
            font-weight: 900;
            letter-spacing: 1.2px;
            text-transform: uppercase;
        }

        .profile-nav a:hover,
        .profile-nav a.active {
            color: #7cff00;
        }

        .top-actions {
            display: flex;
            gap: 10px;
            align-items: center;
            justify-self: end;
            grid-column: 3;
        }

        .top-button {
            min-height: 36px;
            padding: 0 13px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(255,255,255,.12);
            background: #090b09;
            color: #aaa;
            font-size: 8px;
            font-weight: 900;
            letter-spacing: 1.2px;
            text-transform: uppercase;
        }

        .top-button:hover {
            color: #7cff00;
            border-color: #7cff00;
        }

        .profile-shell {
            width: min(1000px, calc(100% - 32px));
            margin: 0 auto;
            padding: 34px 0 60px;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 16px;
            color: #777;
            font-size: 9px;
            font-weight: 900;
            letter-spacing: 1.2px;
            text-transform: uppercase;
        }

        .back-link:hover {
            color: #7cff00;
        }

        .profile-panel {
            border: 1px solid rgba(255,255,255,.10);
            background:
                linear-gradient(
                    145deg,
                    rgba(255,255,255,.025),
                    rgba(255,255,255,.008)
                ),
                #090b09;
        }

        .profile-header {
            padding: 24px 26px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            border-bottom: 1px solid rgba(255,255,255,.08);
        }

        .rider-heading {
            display: flex;
            align-items: center;
            gap: 16px;
            min-width: 0;
        }

        .tier-badge {
            width: 64px;
            height: 64px;
            object-fit: contain;
            flex: 0 0 auto;
        }

        .eyebrow {
            color: #7cff00;
            font-size: 8px;
            font-weight: 1000;
            letter-spacing: 2.6px;
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .rider-name {
            margin: 0;
            font-size: clamp(26px, 4vw, 42px);
            line-height: .95;
            letter-spacing: -1.8px;
            font-style: italic;
            text-transform: uppercase;
            overflow-wrap: anywhere;
        }

        .rider-tier {
            margin-top: 7px;
            color: #777;
            font-size: 9px;
            font-weight: 900;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .rank-box {
            min-width: 110px;
            text-align: right;
        }

        .rank-label {
            color: #666;
            font-size: 8px;
            font-weight: 900;
            letter-spacing: 1.4px;
            text-transform: uppercase;
        }

        .rank-value {
            margin-top: 3px;
            color: #fff;
            font-size: 34px;
            font-weight: 1000;
            font-style: italic;
            line-height: 1;
        }

        .rider-card-section {
            padding: 22px 26px 12px;
        }

        .section-label {
            margin-bottom: 10px;
            color: #666;
            font-size: 8px;
            font-weight: 900;
            letter-spacing: 1.4px;
            text-transform: uppercase;
        }

        .rider-card-frame {
            width: min(760px, 100%);
            margin: 0 auto;
        }

        .rider-card {
            width: 100%;
            aspect-ratio: 1200 / 144;
            display: block;
            object-fit: contain;
            border: 1px solid rgba(255,255,255,.08);
            background: #050605;
            filter: drop-shadow(0 4px 14px rgba(0,0,0,.45));
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(5, minmax(0, 1fr));
            gap: 10px;
            padding: 20px 26px 26px;
        }

        .stat {
            min-height: 82px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            border: 1px solid rgba(255,255,255,.08);
            background: #080a08;
        }

        .stat-label {
            color: #666;
            font-size: 7px;
            font-weight: 900;
            letter-spacing: 1.2px;
            text-transform: uppercase;
        }

        .stat-value {
            margin-top: 5px;
            color: #fff;
            font-size: 22px;
            font-weight: 1000;
            line-height: 1;
        }

        .stat:first-child .stat-value,
        .stat:nth-child(2) .stat-value {
            color: #7cff00;
        }

        .state {
            padding: 48px 22px;
            text-align: center;
            color: #666;
            font-size: 9px;
            font-weight: 900;
            letter-spacing: 1.2px;
            text-transform: uppercase;
        }

        @media (max-width: 850px) {
            .profile-nav {
                display: none;
            }

            .topbar-inner {
                grid-template-columns: auto auto;
            }

            .top-actions {
                grid-column: 2;
            }

            .stats-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
        }

        @media (max-width: 620px) {
            .topbar-inner,
            .profile-shell {
                width: min(100% - 22px, 1000px);
            }

            .brand img {
                height: 38px;
            }

            .brand-name {
                display: none;
            }

            .profile-header {
                padding: 20px 18px;
                align-items: flex-start;
            }

            .tier-badge {
                width: 54px;
                height: 54px;
            }

            .rank-box {
                min-width: 72px;
            }

            .rank-value {
                font-size: 28px;
            }

            .rider-card-section {
                padding: 18px 18px 10px;
            }

            .stats-grid {
                padding: 16px 18px 20px;
                grid-template-columns: 1fr 1fr;
            }

            .stat:last-child {
                grid-column: 1 / -1;
            }
        }
    </style>
</head>

<body>
<div class="profile-page">

    <header class="profile-topbar">
        <div class="topbar-inner">

            <a href="../index.html" class="brand">
                <img
                    src="../assets/logo/motogrid-logo.png"
                    alt="MotoGrid"
                >
                <span class="brand-name">
                    MOTO<span>GRID</span>
                </span>
            </a>

            <nav class="profile-nav">
                <a href="../index.html">Home</a>
                <a href="hosting.html">Hosting</a>
                <a href="servers.html">Servers</a>
                <a href="events.html">Events</a>
                <a href="standings.html" class="active">Standings</a>
                <a href="rider-tiers.html">Rider Tiers</a>
                <a href="guides.html">Guides</a>
            </nav>

            <div class="top-actions">
                <a
                    href="standings.html"
                    class="top-button"
                >
                    Standings
                </a>
            </div>

        </div>
    </header>

    <main class="profile-shell">

        <a
            class="back-link"
            href="standings.html"
        >
            ← Back to Standings
        </a>

        <section
            class="profile-panel"
            id="profileShell"
        >
            <div class="state">
                Loading rider profile...
            </div>
        </section>

    </main>
</div>

<script>
    const PROFILE_ENDPOINT =
        "https://vsqczlaszguuahwhlfcg.supabase.co/functions/v1/public-rider-profile";

    const RIDER_CARD_ASSET_ROOT =
        "../assets/rider-cards/";

    const RIDER_TIER_ASSET_ROOT =
        "../assets/rider-tiers/";

    const animatedCards =
        new Set([
            "mmr-magenta",
            "motogrid-master-rider",
            "giant-killer",
            "king-slayer",
            "the-spoiler"
        ]);

    function riderCardPath(slug) {
        const ext =
            animatedCards.has(slug)
                ? "webp"
                : "png";

        return (
            RIDER_CARD_ASSET_ROOT +
            slug +
            "." +
            ext
        );
    }

    function tierSlug(tier) {
        return String(tier || "Copper I")
            .trim()
            .toLowerCase()
            .replace(/\s+/g, "-");
    }

    function escapeHtml(value) {
        return String(value ?? "")
            .replaceAll("&", "&amp;")
            .replaceAll("<", "&lt;")
            .replaceAll(">", "&gt;")
            .replaceAll('"', "&quot;")
            .replaceAll("'", "&#039;");
    }

    function renderRider(rider) {
        const rank =
            Number(rider.rank || 0);

        const averageFinish =
            rider.average_finish == null
                ? "—"
                : Number(
                    rider.average_finish
                ).toFixed(2);

        const cardSlug =
            rider.displayed_rider_card ||
            "mmr-copper";

        profileShell.innerHTML = `
            <div class="profile-header">

                <div class="rider-heading">
                    <img
                        class="tier-badge"
                        src="${RIDER_TIER_ASSET_ROOT}${tierSlug(rider.tier)}.png"
                        alt="${escapeHtml(rider.tier)} badge"
                    >

                    <div>
                        <div class="eyebrow">
                            MotoGrid Rider
                        </div>

                        <h1 class="rider-name">
                            ${escapeHtml(rider.username)}
                        </h1>

                        <div class="rider-tier">
                            ${escapeHtml(rider.tier)}
                            ·
                            ${Number(rider.total_mmr || 0).toLocaleString()} MMR
                        </div>
                    </div>
                </div>

                <div class="rank-box">
                    <div class="rank-label">
                        Global Rank
                    </div>

                    <div class="rank-value">
                        ${rank > 0 ? "#" + rank : "—"}
                    </div>
                </div>

            </div>

            <div class="rider-card-section">

                <div class="section-label">
                    Displayed Rider Card
                </div>

                <div class="rider-card-frame">
                    <img
                        class="rider-card"
                        src="${riderCardPath(cardSlug)}"
                        alt="${escapeHtml(rider.username)} rider card"
                    >
                </div>

            </div>

            <div class="stats-grid">

                <div class="stat">
                    <div class="stat-label">
                        Wins
                    </div>

                    <div class="stat-value">
                        ${Number(rider.wins || 0)}
                    </div>
                </div>

                <div class="stat">
                    <div class="stat-label">
                        Podiums
                    </div>

                    <div class="stat-value">
                        ${Number(rider.podiums || 0)}
                    </div>
                </div>

                <div class="stat">
                    <div class="stat-label">
                        Average Finish
                    </div>

                    <div class="stat-value">
                        ${averageFinish}
                    </div>
                </div>

                <div class="stat">
                    <div class="stat-label">
                        Races Scored
                    </div>

                    <div class="stat-value">
                        ${Number(rider.races_scored || 0)}
                    </div>
                </div>

                <div class="stat">
                    <div class="stat-label">
                        MMR
                    </div>

                    <div class="stat-value">
                        ${Number(rider.total_mmr || 0).toLocaleString()}
                    </div>
                </div>

            </div>
        `;
    }

    async function loadProfile() {
        const params =
            new URLSearchParams(
                window.location.search
            );

        const riderId =
            params.get("rider");

        if (!riderId) {
            profileShell.innerHTML = `
                <div class="state">
                    Rider profile was not specified.
                </div>
            `;
            return;
        }

        try {
            const response =
                await fetch(
                    `${PROFILE_ENDPOINT}?rider_id=${encodeURIComponent(riderId)}`,
                    {
                        cache: "no-store"
                    }
                );

            const data =
                await response.json();

            if (
                !response.ok ||
                !data.success ||
                !data.rider
            ) {
                throw new Error(
                    data.error ||
                    "Could not load rider."
                );
            }

            renderRider(
                data.rider
            );

        } catch (error) {
            profileShell.innerHTML = `
                <div class="state">
                    ${escapeHtml(
                        error.message ||
                        "Could not load rider profile."
                    )}
                </div>
            `;
        }
    }

    loadProfile();
</script>
</body>
</html>
