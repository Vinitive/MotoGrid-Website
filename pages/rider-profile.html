<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rider Profile | MotoGrid</title>
<style>
:root{--bg:#07090b;--panel:#0f1317;--panel2:#141a20;--line:#242d35;--text:#f4f7f9;--muted:#89959f;--accent:#8aff00}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--text);background:radial-gradient(circle at top,#172028 0,#090c0f 38%,#050607 100%);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
a{color:inherit;text-decoration:none}
.page{width:min(1180px,calc(100% - 32px));margin:0 auto;padding:38px 0 64px}
.back-link{display:inline-flex;align-items:center;gap:8px;color:var(--muted);font-weight:700;margin-bottom:22px}.back-link:hover{color:var(--text)}
.profile-shell{border:1px solid var(--line);background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,.01)),var(--panel);border-radius:22px;overflow:hidden;box-shadow:0 28px 80px rgba(0,0,0,.36)}
.profile-header{padding:34px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:28px;flex-wrap:wrap}
.rider-heading{display:flex;align-items:center;gap:18px}.tier-badge{width:78px;height:78px;object-fit:contain;flex:0 0 auto}
.eyebrow{color:var(--accent);font-size:12px;font-weight:900;letter-spacing:.15em;text-transform:uppercase;margin-bottom:4px}
.rider-name{margin:0;font-size:clamp(30px,5vw,52px);line-height:1;letter-spacing:-.045em}.rider-tier{color:var(--muted);margin-top:8px;font-size:15px;font-weight:700}
.rank-box{text-align:right}.rank-label{color:var(--muted);text-transform:uppercase;font-size:11px;letter-spacing:.14em;font-weight:900}.rank-value{font-size:42px;font-weight:950;letter-spacing:-.04em;margin-top:2px}
.rider-card-area{padding:30px 34px 10px}.section-label{color:var(--muted);text-transform:uppercase;letter-spacing:.14em;font-weight:900;font-size:11px;margin-bottom:12px}
.rider-card{width:100%;aspect-ratio:8.333333/1;object-fit:cover;display:block;border-radius:12px;border:1px solid var(--line);background:#050607}
.stats-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px;padding:26px 34px 34px}
.stat{background:var(--panel2);border:1px solid var(--line);border-radius:16px;padding:18px;min-height:112px;display:flex;flex-direction:column;justify-content:center}
.stat-label{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.12em;font-weight:900}.stat-value{font-size:28px;font-weight:950;margin-top:6px;letter-spacing:-.03em}
.state{padding:56px 24px;text-align:center;color:var(--muted);font-weight:700}
@media(max-width:820px){.stats-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.rank-box{text-align:left}}
@media(max-width:520px){.page{width:min(100% - 20px,1180px);padding-top:20px}.profile-header,.rider-card-area,.stats-grid{padding-left:18px;padding-right:18px}.tier-badge{width:58px;height:58px}.stats-grid{grid-template-columns:1fr}.rider-card{border-radius:8px}}
</style>
</head>
<body>
<main class="page">
<a class="back-link" href="standings.html">← Back to Standings</a>
<section class="profile-shell" id="profileShell"><div class="state">Loading rider profile...</div></section>
</main>
<script>
const PROFILE_ENDPOINT="https://vsqczlaszguuahwhlfcg.supabase.co/functions/v1/public-rider-profile";
const RIDER_CARD_ASSET_ROOT="../assets/rider-cards/";
const RIDER_TIER_ASSET_ROOT="../assets/rider-tiers/";
const animatedCards=new Set(["mmr-magenta","motogrid-master-rider","giant-killer","king-slayer","the-spoiler"]);

function riderCardPath(slug){
  const ext=animatedCards.has(slug)?"webp":"png";
  return RIDER_CARD_ASSET_ROOT+slug+"."+ext;
}
function tierSlug(tier){return String(tier||"Copper I").trim().toLowerCase().replace(/\s+/g,"-")}
function escapeHtml(value){return String(value??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;")}

function renderRider(rider){
  const rank=Number(rider.rank||0);
  const averageFinish=rider.average_finish==null?"—":Number(rider.average_finish).toFixed(2);
  const cardSlug=rider.displayed_rider_card||"mmr-copper";
  profileShell.innerHTML=`
    <div class="profile-header">
      <div class="rider-heading">
        <img class="tier-badge" src="${RIDER_TIER_ASSET_ROOT}${tierSlug(rider.tier)}.png" alt="${escapeHtml(rider.tier)} badge">
        <div>
          <div class="eyebrow">MotoGrid Rider</div>
          <h1 class="rider-name">${escapeHtml(rider.username)}</h1>
          <div class="rider-tier">${escapeHtml(rider.tier)} · ${Number(rider.total_mmr||0).toLocaleString()} MMR</div>
        </div>
      </div>
      <div class="rank-box">
        <div class="rank-label">Global Rank</div>
        <div class="rank-value">${rank>0?"#"+rank:"—"}</div>
      </div>
    </div>
    <div class="rider-card-area">
      <div class="section-label">Displayed Rider Card</div>
      <img class="rider-card" src="${riderCardPath(cardSlug)}" alt="${escapeHtml(rider.username)} rider card">
    </div>
    <div class="stats-grid">
      <div class="stat"><div class="stat-label">Wins</div><div class="stat-value">${Number(rider.wins||0)}</div></div>
      <div class="stat"><div class="stat-label">Podiums</div><div class="stat-value">${Number(rider.podiums||0)}</div></div>
      <div class="stat"><div class="stat-label">Average Finish</div><div class="stat-value">${averageFinish}</div></div>
      <div class="stat"><div class="stat-label">Races Scored</div><div class="stat-value">${Number(rider.races_scored||0)}</div></div>
      <div class="stat"><div class="stat-label">MMR</div><div class="stat-value">${Number(rider.total_mmr||0).toLocaleString()}</div></div>
    </div>`;
}

async function loadProfile(){
  const riderId=new URLSearchParams(window.location.search).get("rider");
  if(!riderId){profileShell.innerHTML='<div class="state">Rider profile was not specified.</div>';return}
  try{
    const response=await fetch(`${PROFILE_ENDPOINT}?rider_id=${encodeURIComponent(riderId)}`,{cache:"no-store"});
    const data=await response.json();
    if(!response.ok||!data.success||!data.rider)throw new Error(data.error||"Could not load rider.");
    renderRider(data.rider);
  }catch(error){
    profileShell.innerHTML=`<div class="state">${escapeHtml(error.message||"Could not load rider profile.")}</div>`;
  }
}
loadProfile();
</script>
</body>
</html>
