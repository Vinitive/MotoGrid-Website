name: Build MotoGrid MXGP 26 Windows installer
on:
  workflow_dispatch:
  push:
    paths:
      - 'mxgp26-desktop/**'
    branches:
      - mxgp26-desktop-app
jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: mxgp26-desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mxgp26-desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Install dependencies
        run: npm install
      - name: Build installer
        run: npm run tauri -- build --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: MotoGrid-MXGP26-Windows-Installer
          path: mxgp26-desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30
